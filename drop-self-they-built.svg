<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380">
  <defs>

    <!-- Rough stroke distortion -->
    <filter id="rough" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="4" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feTurbulence type="turbulence" baseFrequency="0.08 0.12" numOctaves="3" seed="8" result="noise2"/>
      <feDisplacementMap in="displaced" in2="noise2" scale="3" xChannelSelector="G" yChannelSelector="B"/>
    </filter>

    <!-- Heavier distortion for outer ghost strokes -->
    <filter id="rough2" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.09" numOctaves="5" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="rough3" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.07" numOctaves="4" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="G" yChannelSelector="R"/>
    </filter>

  </defs>

  <!-- Background white -->
  <rect width="1400" height="380" fill="white"/>

  <!-- === LAYER SYSTEM: ghost strokes first, main on top === -->

  <!-- Ghost layer 1 — slightly offset + rotated, lighter -->
  <g transform="rotate(-2.5, 700, 190) translate(6, 8)" opacity="0.22" filter="url(#rough2)">
    <text
      x="700" y="245"
      text-anchor="middle"
      font-family="'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="195"
      fill="none"
      stroke="#888888"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      letter-spacing="2"
      font-style="italic"
    >DROP SELF THEY BUILT</text>
  </g>

  <!-- Ghost layer 2 — different offset -->
  <g transform="rotate(-1.8, 700, 190) translate(-5, 12)" opacity="0.18" filter="url(#rough3)">
    <text
      x="700" y="245"
      text-anchor="middle"
      font-family="'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="195"
      fill="none"
      stroke="#999999"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      letter-spacing="2"
      font-style="italic"
    >DROP SELF THEY BUILT</text>
  </g>

  <!-- Ghost layer 3 — thin stray line feel -->
  <g transform="rotate(-3.2, 700, 190) translate(12, -4)" opacity="0.14" filter="url(#rough2)">
    <text
      x="700" y="245"
      text-anchor="middle"
      font-family="'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="195"
      fill="none"
      stroke="#aaaaaa"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      letter-spacing="2"
      font-style="italic"
    >DROP SELF THEY BUILT</text>
  </g>

  <!-- Ghost layer 4 — looser, wider -->
  <g transform="rotate(-1.2, 700, 190) translate(-8, 5)" opacity="0.16" filter="url(#rough3)">
    <text
      x="700" y="248"
      text-anchor="middle"
      font-family="'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="198"
      fill="none"
      stroke="#aaaaaa"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      letter-spacing="3"
      font-style="italic"
    >DROP SELF THEY BUILT</text>
  </g>

  <!-- MAIN STROKE — primary weight -->
  <g transform="rotate(-2, 700, 190)" filter="url(#rough)">
    <text
      x="700" y="245"
      text-anchor="middle"
      font-family="'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="195"
      fill="none"
      stroke="#a0a0a0"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      letter-spacing="2"
      font-style="italic"
    >DROP SELF THEY BUILT</text>
  </g>

  <!-- MAIN STROKE inner thin — for double-line sketch effect -->
  <g transform="rotate(-2.2, 700, 190) translate(2, 2)" filter="url(#rough3)">
    <text
      x="700" y="244"
      text-anchor="middle"
      font-family="'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="195"
      fill="none"
      stroke="#b8b8b8"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      letter-spacing="2"
      font-style="italic"
    >DROP SELF THEY BUILT</text>
  </g>

</svg>
