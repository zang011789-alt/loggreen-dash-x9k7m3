<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>패키지 아이콘 미리보기</title>
<style>
  body { background: #2a2a2a; display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; font-family: sans-serif; }
  h1 { width: 100%; color: white; font-size: 18px; margin-bottom: 10px; }
  .icon-box { display: flex; flex-direction: column; align-items: center; gap: 12px; background: #444; padding: 24px; border-radius: 12px; min-width: 120px; }
  .icon-box img { width: 100px; height: 100px; object-fit: contain; }
  .icon-box span { color: #ccc; font-size: 13px; }
</style>
</head>
<body>
<h1>OVNS 패키지 심볼 (실제 공식 기호 / 투명배경)</h1>
<div class="icon-box">
  <img src="CE_clean.svg">
  <span>CE 마크</span>
</div>
<div class="icon-box">
  <img src="RoHS.svg">
  <span>RoHS</span>
</div>
<div class="icon-box">
  <img src="KC.png">
  <span>KC 인증</span>
</div>
<div class="icon-box">
  <img src="WEEE.svg">
  <span>WEEE (분리배출)</span>
</div>
<div class="icon-box">
  <img src="recycle.svg">
  <span>재활용</span>
</div>
<div class="icon-box">
  <img src="no-vaping.svg">
  <span>흡입금지</span>
</div>
</body>
</html>
