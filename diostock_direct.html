<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e2e8f0;font-family:'Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;min-height:100vh}
header{background:#161b22;border-bottom:1px solid #21262d;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:16px}
.logo{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo em{color:#a78bfa;font-style:normal}
.brand-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#a78bfa18;color:#a78bfa;border:1px solid #a78bfa40}
.header-right{display:flex;align-items:center;gap:14px}
.last-updated{font-size:12px;color:#6e7681;white-space:nowrap}
.source-tabs{display:flex;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:3px;gap:2px}
.source-tab{padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;color:#6e7681;border:none;background:none;font-weight:600;transition:all .15s;font-family:inherit}
.source-tab:hover{color:#c9d1d9}
.source-tab.active.all{background:#a78bfa20;color:#a78bfa}
.source-tab.active.fb{background:#388bfd20;color:#58a6ff}
.source-tab.active.tk{background:#ff004f20;color:#ff6b8a}
.source-tab.active.gg{background:#4285f420;color:#6ea8ff}
.source-tab.active.cmp{background:#f0883e20;color:#f0883e}
.container{max-width:1600px;margin:0 auto;padding:20px 28px 60px}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.ctrl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tab-group{display:flex;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:3px;gap:2px}
.tab-btn{padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px;color:#6e7681;transition:all .15s;border:none;background:none;white-space:nowrap;font-family:inherit}
.tab-btn:hover{color:#c9d1d9}
.date-group .tab-btn.active{background:#388bfd20;color:#58a6ff}
.level-group .tab-btn.active{background:#e3b34120;color:#e3b341}
.view-group .tab-btn.active{background:#a371f720;color:#c4a5fa}
.date-range{display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:5px 12px}
.date-range input[type=date]{background:transparent;border:none;color:#c9d1d9;font-size:13px;outline:none;cursor:pointer;color-scheme:dark;font-family:inherit}
.date-range .sep{color:#4e5564;font-size:13px}
.date-apply{background:#388bfd;border:none;color:#fff;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid #21262d;background:#161b22;color:#8b949e}
.chip.ok{color:#3fb950;border-color:#3fb95040}.chip.no{color:#6e7681}
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1300px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.container,header{padding-left:16px;padding-right:16px}}
.kpi-card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px 14px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent,#388bfd);opacity:.7}
.kpi-label{font-size:10.5px;color:#6e7681;letter-spacing:.04em;margin-bottom:6px}
.kpi-value{font-size:21px;font-weight:700;color:#f0f6fc;letter-spacing:-.5px;line-height:1}
.kpi-sub{font-size:10.5px;color:#6e7681;margin-top:5px}
.k1{--accent:#388bfd}.k2{--accent:#f0883e}.k3{--accent:#a371f7}.k4{--accent:#6e7681}.k5{--accent:#e3b341}.k6{--accent:#3fb950}.k7{--accent:#4ade80}
.roas-good{color:#3fb950!important}.roas-mid{color:#e3b341!important}.roas-bad{color:#f78166!important}
.table-section{background:#161b22;border:1px solid #21262d;border-radius:10px;overflow:hidden}
.table-header-row{padding:13px 18px;border-bottom:1px solid #21262d;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.table-title{font-size:14px;font-weight:600;color:#f0f6fc;display:flex;align-items:center;gap:10px}
.table-meta{font-size:12px;color:#6e7681}
.back-btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.tw{overflow:auto;max-height:calc(100vh - 360px);min-height:300px}
table{width:100%;border-collapse:collapse}
th{padding:8px 11px;text-align:right;font-size:10.5px;font-weight:600;color:#6e7681;letter-spacing:.04em;border-bottom:1px solid #21262d;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:#161b22;z-index:2}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
th:hover{color:#c9d1d9}
td{padding:7px 11px;font-size:12.5px;color:#c9d1d9;border-bottom:1px solid #1c2128;white-space:nowrap;text-align:right}
tbody tr:hover td{background:#1c2128}
.sort-asc::after{content:' ↑'}.sort-desc::after{content:' ↓'}
.name-link{color:#58a6ff;cursor:pointer;text-decoration:underline dotted;font-weight:700}
.name-pop{color:#79c0ff;cursor:pointer}
.cell-name{max-width:340px;overflow:hidden;text-overflow:ellipsis}
.cell-sub{color:#6e7681;font-size:11.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.t-fb{background:#388bfd20;color:#58a6ff;border:1px solid #388bfd40}
.t-tk{background:#ff004f20;color:#ff6b8a;border:1px solid #ff004f40}
.t-gg{background:#4285f420;color:#6ea8ff;border:1px solid #4285f440}
.t-unk{background:#6e768120;color:#8b949e;border:1px solid #6e768140}
.lack{display:inline-block;font-size:10.5px;color:#6e7681;border:1px dashed #30363d;border-radius:4px;padding:0 5px}
.total-row td{background:#1c2128!important;font-weight:700;color:#f0f6fc;border-top:1px solid #30363d;position:sticky;bottom:0}
.daily-header-row td{background:#11161d;font-weight:600;border-top:1px solid #21262d}
.daily-sub td{color:#8b949e;font-size:12px}
.daily-sub td:first-child{padding-left:28px}
.search-bar{margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-wrap{position:relative;max-width:360px;flex:1;min-width:220px}
.search-wrap input{width:100%;background:#161b22;border:1px solid #21262d;border-radius:8px;color:#c9d1d9;font-size:13px;padding:7px 12px;outline:none;font-family:inherit}
.search-wrap input:focus{border-color:#388bfd}
.search-wrap input::placeholder{color:#3d4451}
.search-info{font-size:12px;color:#6e7681}
.chk{font-size:12px;color:#8b949e;display:flex;align-items:center;gap:5px;cursor:pointer}
.note{font-size:11.5px;color:#6e7681;margin-top:10px;line-height:1.6}
.gap-hi{color:#f78166}
#pop{display:none;position:fixed;inset:0;background:#000a;z-index:300;align-items:center;justify-content:center;padding:20px}
#pop .box{background:#161b22;border:1px solid #30363d;border-radius:12px;width:min(1180px,100%);max-height:92vh;overflow:auto;padding:18px 20px}
#pop .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
#pop .pt{font-size:15px;font-weight:700;color:#f0f6fc;word-break:break-all}
#pop .ps{font-size:12px;color:#6e7681;margin-top:4px}
#pop .x{background:none;border:none;color:#8b949e;font-size:22px;cursor:pointer}
#pop .pk{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
#pop .pk div{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:8px 10px;font-size:11px;color:#6e7681}
#pop .pk b{display:block;font-size:16px;color:#f0f6fc;margin-top:3px}
.ch{position:relative;height:260px;margin:6px 0 12px}
.leg{display:flex;gap:14px;font-size:11.5px;color:#8b949e;flex-wrap:wrap}.leg i{display:inline-block;width:16px;border-top:2.5px solid;margin-right:5px;vertical-align:middle}
#pwScreen{position:fixed;inset:0;background:#0d1117;display:flex;align-items:center;justify-content:center;z-index:500}
.pw-wrap{display:flex;flex-direction:column;align-items:center;gap:30px}
.pw-logo{font-size:13px;font-weight:600;color:#4e5564;letter-spacing:.08em}.pw-logo em{color:#a78bfa;font-style:normal}
.pw-row{display:flex;border:1px solid #21262d;border-radius:10px;overflow:hidden;width:300px}
.pw-row:focus-within{border-color:#a78bfa}
#pwInput{flex:1;background:#161b22;border:none;color:#e2e8f0;padding:12px 14px;font-size:14px;outline:none;font-family:inherit}
.pw-row button{background:#21262d;border:none;color:#c9d1d9;padding:0 16px;cursor:pointer;font-family:inherit}
#pwError{color:#f78166;font-size:12px;height:14px;margin-top:8px}
</style></head><body>

  if(x.ds!=null){o.ds+=x.ds;o.dc+=x.dc||0;o.v+=x.v||0;o.dsD++}}
const blank=(n,m,extra)=>Object.assign({n,m,sp:0,ds:0,dc:0,v:0,mv:0,spD:0,dsD:0,mvLack:false,days:{}},extra||{});
// ── 캠페인 ──
function campRows(dl){const map={};
  for(const d of dl)for(const [n,x] of Object.entries(DD[d].camp||{})){const m=mOf(n);if(!selMedia().includes(m))continue;
    addDay(map[n]||(map[n]=blank(n,m,{rk:n})),d,{sp:x.sp||0,ds:x.ds,dc:x.dc,v:x.v,mv:x.mv})}
  return Object.values(map).map(fin)}
// ── 소재 (매체 광고명 ↔ 카페24 키워드 정규화 매칭) ──
function creaDay(d){const c=DD[d].crea||{},raw=DD[d].ads||{},out=[];
  // 광고 목록: 원래 키(정확 매칭용) + 정규화 키(MK_) 둘 다로 찾되, 한 광고는 한 소재에만 붙인다(중복 집계 방지)
  const ads=Object.entries(raw).map(([k,y])=>({k,mk:MK_(k),y,used:false}));
  const pick=(x,ak)=>{const mk=MK_(ak),okM=a=>!x.m||a.y.m===x.m||a.y.m==='dup';
    let hit=ads.filter(a=>!a.used&&a.k===ak&&okM(a));          // 1순위: 이름 완전 일치
    if(!hit.length)hit=ads.filter(a=>!a.used&&a.mk===mk&&okM(a)); // 2순위: 편집번호·접두어 무시 매칭
    if(!hit.length)return null;
    const m0=x.m||hit[0].y.m;hit=hit.filter(a=>a.y.m===m0||a.y.m==='dup');  // 매체 하나로만
    const z={m:m0,camp:hit[0].y.camp,raw:hit[0].y.raw,sp:0,mv:0};hit.forEach(a=>{a.used=true;z.sp+=a.y.sp;z.mv+=a.y.mv});return z};
  const ents=Object.entries(c).map(([k,x])=>({x,ak:x.ak!=null?x.ak:k}));
  // 매체가 정해진(새 파일) 소재 먼저, 매체 모르는(옛 파일) 소재는 나중에 남은 광고와 매칭
  ents.sort((p,q)=>(q.x.m?1:0)-(p.x.m?1:0));
  for(const {x,ak} of ents){const y=pick(x,ak);let m=x.m||(y?y.m:'unk');if(m==='unk'&&/^00[12]_/.test(ak))m='gg';if(ak==='')m='none';
    out.push({rk:MK_(ak)+'@'+m,raw:x.raw,m,camp:x.camp||(y?y.camp:''),ds:x.ds,dc:x.dc,v:x.v,sp:y?y.sp:0,mv:y?y.mv:null})}
  const rest={};for(const a of ads)if(!a.used){const key=a.mk+'@'+a.y.m;const z=rest[key]||(rest[key]={m:a.y.m,camp:a.y.camp,raw:a.y.raw,sp:0,mv:0});z.sp+=a.y.sp;z.mv+=a.y.mv}
  for(const [key,y] of Object.entries(rest))out.push({rk:key,raw:y.raw,m:y.m,camp:y.camp,ds:DD[d].crea?0:null,dc:DD[d].crea?0:null,v:DD[d].crea?0:null,sp:y.sp,mv:y.mv});
  // 같은 날 같은 rk가 여러 줄이면 합쳐서 하나로
  const merged={};for(const r of out){const z=merged[r.rk];if(!z){merged[r.rk]={...r};continue}
    z.sp=(z.sp||0)+(r.sp||0);z.mv=(z.mv==null&&r.mv==null)?null:(z.mv||0)+(r.mv||0);
    if(r.ds!=null){z.ds=(z.ds||0)+r.ds;z.dc=(z.dc||0)+(r.dc||0);z.v=(z.v||0)+(r.v||0)}z.camp=z.camp||r.camp}
  return Object.values(merged)}
function creaRows(dl){const map={};
  for(const d of dl)for(const r of creaDay(d)){const m=r.m;
    if(!(S.m==='all'||S.m==='cmp'||m===S.m||(m==='dup'&&(S.m==='fb'||S.m==='tk'))))continue;
    if(S.camp&&r.camp!==S.camp)continue;
    const o=map[r.rk]||(map[r.rk]=blank(r.raw,m,{rk:r.rk,camp:r.camp}));o.camp=o.camp||r.camp;addDay(o,d,r)}
  return Object.values(map).map(fin)}

function sortRows(rows){const s=S.sort;return rows.sort((a,b)=>{const x=a[s.k],y=b[s.k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y):x-y)*s.d})}
function filt(rows){let r=rows;if(S.q){const q=S.q.toLowerCase();r=r.filter(o=>o.n.toLowerCase().includes(q)||(o.camp||'').toLowerCase().includes(q))}
  if(S.hide)r=r.filter(o=>o.sp>0||o.ds>0);return r}

// ── KPI ──
function kpis(){const dl=range(),ms=selMedia();let sp=0,ds=0,dc=0,v=0,mv=0,mvOk=true;
  ms.forEach(m=>{const x=mediaAgg(dl,m);if(!x)return;sp+=x.sp;ds+=x.ds;dc+=x.dc;v+=x.v;if(x.mv==null)mvOk=false;else mv+=x.mv});
  const dR=pctv(ds,sp),mR=mvOk?pctv(mv,sp):null;
  let tA=0,tS=0,tN=0;dl.forEach(d=>{const t=DD[d].total;if(t){tA+=t.ad;tS+=t.sales;tN++}});
  const allTab=S.m==='all'||S.m==='cmp',tR=allTab&&tN===dl.length&&tN?tS/tA*100:null;
  const K=[['k1','총 소진금액',fmt(sp),`${dl.length}일 · ${ms.map(m=>MN[m]).join('·')}`],
    ['k2','직접매출',fmt(ds),`구매 ${dc.toLocaleString()}건 · CVR ${v?(dc/v*100).toFixed(2):0}%`],
    ['k3','직접 ROAS',P(dR),'카페24 2시간 기여'],
    ['k4','매체 ROAS',P0(mR),mR==null?'매체값 없는 날 포함 → 부족':`매체매출 ${fmt(mv)}`],
    ['k5','간극 (매체÷직접)',mR!=null&&dR?(mR/dR).toFixed(2)+'배':LACK,'1.0배에 가까울수록 일치'],
    ['k6','직접 CPA',won(dc?sp/dc:null),`객단가 ${won(dc?ds/dc:null)}`],
    ['k7','전체 ROAS',P0(tR),!allTab?'전체 탭에서만 표시':tR==null?`전체매출 있는 날 ${tN}/${dl.length}일 → 부족`:`전체매출 ${fmt(tS)}`]];
  document.getElementById('kpis').innerHTML=K.map(([c,l,v,s])=>`<div class="kpi-card ${c}"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div><div class="kpi-sub">${s}</div></div>`).join('');
  const lastD=dl[dl.length-1]||S.to,day=DD[lastD]||{},md=day.media||{};
  const ch=[['직접값',MK.every(m=>md[m]&&md[m].ds!=null)],['메타 매체값',md.fb&&md.fb.mv!=null],['틱톡 매체값',md.tk&&md.tk.mv!=null],['구글 매체값',md.gg&&md.gg.mv!=null],['캠페인 직접값',Object.values(day.camp||{}).some(x=>x.ds!=null)],['소재 직접값',!!(day.crea&&Object.keys(day.crea).length)],['전체매출',!!day.total]];
  document.getElementById('chips').innerHTML=`<span class="chip">${lastD.slice(5)} 기준</span>`+ch.map(([t,ok])=>`<span class="chip ${ok?'ok':'no'}">${ok?'✓':'·'} ${t}</span>`).join('');
  document.getElementById('rangeInfo').textContent=`${S.from} ~ ${S.to} (${dl.length}일)`}

// ── 표 ──
const MC=[['sp','광고비'],['ds','직접매출'],['dR','직접 ROAS'],['mv','매체매출'],['mR','매체 ROAS'],['gap','간극'],['dc','직접구매'],['cpa','직접 CPA'],['v','유입'],['cvr','CVR'],['aov','객단가']];
function head(cols){return '<thead><tr>'+cols.map(([k,t,cls])=>`<th data-k="${k}" class="${cls||''} ${S.sort.k===k?(S.sort.d<0?'sort-desc':'sort-asc'):''}">${t}</th>`).join('')+'</tr></thead>'}
function mt(o){return `<td><b>${o.sp?fmt(o.sp):LACK}</b></td><td>${o.hasD?fmt(o.ds):LACK}</td><td><b>${P(o.dR)}</b></td><td>${o.sp&&o.mR!=null?fmt(o.mv):LACK}</td><td>${P0(o.mR)}</td><td>${gapC(o.mR,o.dR)}</td><td>${o.hasD?o.dc.toLocaleString():LACK}</td><td>${o.cpa?won(o.cpa):'—'}</td><td>${o.hasD?o.v.toLocaleString():LACK}</td><td>${o.cvr!=null?o.cvr.toFixed(2)+'%':'—'}</td><td>${o.aov?won(o.aov):'—'}</td>`}
function dt(x){if(!x)return MC.map(()=>'<td>—</td>').join('');
  const sp=x.sp||0,dR=x.ds!=null&&sp?x.ds/sp*100:null,mR=sp&&x.mv!=null?x.mv/sp*100:null;
  return `<td>${sp?fmt(sp):'—'}</td><td>${x.ds!=null?fmt(x.ds):LACK}</td><td>${P(dR)}</td><td>${sp?(x.mv!=null?fmt(x.mv):LACK):'—'}</td><td>${sp?(mR!=null?P0(mR):LACK):'—'}</td><td>${gapC(mR,dR)}</td><td>${x.ds!=null?(x.dc||0):'—'}</td><td>${x.dc&&sp?won(sp/x.dc):'—'}</td><td>${x.v!=null?(x.v||0).toLocaleString():'—'}</td><td>${x.v?((x.dc||0)/x.v*100).toFixed(2)+'%':'—'}</td><td>${x.dc?won(x.ds/x.dc):'—'}</td>`}
function totalRow(rows,label,lead){const o=blank(label,'');rows.forEach(r=>{for(const [d,x] of Object.entries(r.days)){const k=r.rk+'|'+d;o.days[k]=x}
    o.sp+=r.sp;o.ds+=r.ds;o.dc+=r.dc;o.v+=r.v;o.dsD+=r.dsD;if(r.sp&&r.mR==null)o.mvLack=true;else o.mv+=r.mv});fin(o);
  return `<tr class="total-row"><td>${label}</td>${lead}${mt(o)}</tr>`}

function render(){kpis();const cmp=S.m==='cmp';
  document.getElementById('searchBar').style.display=cmp?'none':'';
  ['levelGroup','viewGroup'].forEach(g=>document.getElementById(g).style.display=cmp?'none':'');
  if(cmp)return renderCmp();return S.level==='camp'?renderCamp():renderCrea()}

function renderCamp(){const dl=range(),rows=sortRows(filt(campRows(dl)));
  document.getElementById('tTitle').innerHTML='캠페인 상세';document.getElementById('tMeta').textContent=`${rows.length}개 · 캠페인명 클릭 = 소재 보기 · 오른쪽 📈 = 일별 추이`;
  let h=head([['n','캠페인명','l'],['m','매체','l'],...MC])+'<tbody>';
  rows.forEach(o=>{const nm=`<span class="name-link" onclick="drill('${esc(o.n)}')">${o.n}</span><span style="font-size:10px;color:#4e5564;margin:0 6px 0 4px">▶</span><span style="cursor:pointer" title="일별 추이" onclick="openPop('camp','${esc(o.n)}')">📈</span>`;
    h+=`<tr class="${S.view==='daily'?'daily-header-row':''}"><td class="cell-name">${nm}</td><td class="l">${tag(o.m)}</td>${mt(o)}</tr>`;
    if(S.view==='daily')dl.slice().reverse().forEach(d=>{const x=o.days[d];if(x)h+=`<tr class="daily-sub"><td>${dlab(d)}</td><td></td>${dt(x)}</tr>`})});
  setTbl(h+'</tbody><tfoot>'+totalRow(rows,`합계 (${rows.length})`,'<td></td>')+'</tfoot>');document.getElementById('searchInfo').textContent=''}

function renderCrea(){const dl=range(),rows=sortRows(filt(creaRows(dl)));
  const back=S.camp?`<button class="back-btn" onclick="drill(null)">← 전체 소재</button>`:'';
  document.getElementById('tTitle').innerHTML=`${back}소재 상세${S.camp?` · <span style="color:#58a6ff">${S.camp}</span>`:''}`;
  document.getElementById('tMeta').textContent=`${rows.length}개 · 소재명 클릭 = 일별 추이`;
  let h=head([['n','소재명','l'],['m','매체','l'],['camp','캠페인','l'],...MC])+'<tbody>';
  rows.forEach(o=>{const nm=`<span class="name-pop" onclick="openPop('crea','${esc(o.rk)}')" title="${esc(o.n)}">${o.n}</span>`;
    const lead=`<td class="l">${o.m==='unk'?LACK:o.m==='none'?'—':tag(o.m)}</td><td class="l cell-sub">${o.camp?`<span class="name-link" style="font-weight:400" onclick="drill('${esc(o.camp)}')">${o.camp}</span>`:'—'}</td>`;
    h+=`<tr class="${S.view==='daily'?'daily-header-row':''}"><td class="cell-name">${nm}</td>${lead}${mt(o)}</tr>`;
    if(S.view==='daily')dl.slice().reverse().forEach(d=>{const x=o.days[d];if(x)h+=`<tr class="daily-sub"><td>${dlab(d)}</td><td></td><td></td>${dt(x)}</tr>`})});
  setTbl(h+'</tbody><tfoot>'+totalRow(rows,`합계 (${rows.length})`,'<td></td><td></td>')+'</tfoot>');
  const miss=dl.filter(d=>!DD[d].crea);document.getElementById('searchInfo').textContent=miss.length?`※ 소재 직접값 파일 없는 날 ${miss.length}일은 직접값이 부족으로 빠져요`:''}

function renderCmp(){const dl=range().slice().reverse();
  document.getElementById('tTitle').innerHTML='매체 비교 · 날짜별';document.getElementById('tMeta').textContent='셀 = 직접 ROAS / 매체 ROAS';
  let h='<thead><tr><th class="l">날짜</th><th>3사 광고비</th><th>3사 직접</th><th>3사 매체</th><th>간극</th>'+MK.map(m=>`<th>${MN[m]} 광고비</th><th>${MN[m]} 직접</th><th>${MN[m]} 매체</th>`).join('')+'<th>채널없음 매출</th><th>전체 매출</th><th>전체 ROAS</th></tr></thead><tbody>';
  for(const d of dl){let sp=0,ds=0,mv=0,ok=true;MK.forEach(m=>{const x=mediaAgg([d],m);if(!x)return;sp+=x.sp;ds+=x.ds;if(x.mv==null)ok=false;else mv+=x.mv});
    const dR=pctv(ds,sp),mR=ok?pctv(mv,sp):null,t=DD[d].total;
    h+=`<tr><td><b>${dlab(d)}</b></td><td>${fmt(sp)}</td><td><b>${P(dR)}</b></td><td>${P0(mR)}</td><td>${gapC(mR,dR)}</td>`+
      MK.map(m=>{const x=mediaAgg([d],m);if(!x||!x.sp)return '<td>—</td><td>—</td><td>—</td>';return `<td>${fmt(x.sp)}</td><td>${P(pctv(x.ds,x.sp))}</td><td>${P0(pctv(x.mv,x.sp))}</td>`}).join('')+
      `<td>${fmt(((DD[d].media||{}).none||{}).ds)}</td><td>${t?fmt(t.sales):LACK}</td><td>${t?P(t.sales/t.ad*100):LACK}</td></tr>`}
  setTbl(h+'</tbody>');document.getElementById('searchInfo').textContent=''}

function setTbl(h){const t=document.getElementById('tbl');t.innerHTML=h;
  t.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;S.sort={k,d:S.sort.k===k?-S.sort.d:(['n','m','camp'].includes(k)?1:-1)};render()})}
function drill(c){S.camp=c;S.level='crea';setActive('levelGroup','crea');render();window.scrollTo({top:0,behavior:'smooth'})}

// ── 팝업: 일별 추이 (캠페인·소재) ──
let popChart=null;
function openPop(kind,key){const last=DAYS.indexOf(S.to),dl=DAYS.slice(Math.max(0,last-13),last+1),rows={};let info={};
  for(const d of dl){if(kind==='crea'){for(const r of creaDay(d))if(r.rk===key){rows[d]=r;info=r}}
    else{const x=(DD[d].camp||{})[key];if(x){rows[d]={sp:x.sp||0,ds:x.ds,dc:x.dc,v:x.v,mv:x.mv};info={raw:key,m:mOf(key),camp:key}}}}
  document.getElementById('popT').textContent=info.raw||key;
  document.getElementById('popS').textContent=`${MN[info.m]||'-'}${kind==='crea'?' · '+(info.camp||'캠페인 미확인'):''} · 최근 14일 ${dl[0]} ~ ${dl[dl.length-1]}`;
  let sp=0,ds=0,dc=0,mv=0,s2=0,d2=0,mvOk=true;Object.values(rows).forEach(r=>{sp+=r.sp||0;ds+=r.ds||0;dc+=r.dc||0;if(r.sp&&r.mv==null)mvOk=false;else mv+=r.mv||0;if(r.sp&&r.ds!=null){s2+=r.sp;d2+=r.ds}});
  const dR=s2?d2/s2*100:null,mR=sp&&mvOk?mv/sp*100:null;
  document.getElementById('popK').innerHTML=[['14일 광고비',fmt(sp)],['14일 직접매출',fmt(ds)],['직접 ROAS',P(dR)],['매체 ROAS',P0(mR)],['간극',gapC(mR,dR)],['직접 구매',dc+'건']].map(([l,v])=>`<div>${l}<b>${v}</b></div>`).join('');
  let h='<thead><tr><th class="l">날짜</th>'+MC.map(([,t])=>`<th>${t}</th>`).join('')+'</tr></thead><tbody>';
  dl.slice().reverse().forEach(d=>{h+=`<tr><td>${dlab(d)}</td>${dt(rows[d])}</tr>`});
  document.getElementById('popTbl').innerHTML=h+'</tbody>';document.getElementById('pop').style.display='flex';
  if(popChart)popChart.destroy();
  const g=f=>dl.map(d=>{const r=rows[d];return r?f(r):null});
  popChart=new Chart(document.getElementById('popC'),{data:{labels:dl.map(d=>d.slice(5).replace('-','/')),datasets:[
    {type:'bar',label:'광고비(만원)',data:g(r=>r.sp?Math.round(r.sp/1e4):null),backgroundColor:'#388bfd40',yAxisID:'y2',order:3},
    {type:'line',label:'직접 ROAS',data:g(r=>r.sp&&r.ds!=null?Math.round(r.ds/r.sp*100):null),borderColor:'#f0883e',backgroundColor:'#f0883e',borderWidth:2,pointRadius:3,tension:.25,yAxisID:'y',spanGaps:true,order:1},
    {type:'line',label:'매체 ROAS',data:g(r=>r.sp&&r.mv!=null?Math.round(r.mv/r.sp*100):null),borderColor:'#8b949e',backgroundColor:'#8b949e',borderDash:[5,4],borderWidth:2,pointRadius:0,tension:.25,yAxisID:'y',spanGaps:true,order:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y==null?'—':c.parsed.y.toLocaleString()}${c.dataset.yAxisID==='y'?'%':'만'}`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#6e7681'}},y:{grid:{color:'#21262d'},ticks:{color:'#6e7681',callback:v=>v+'%'}},y2:{display:false,beginAtZero:true}}}})}
function closePop(){document.getElementById('pop').style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

// ── 컨트롤 ──
function setActive(gid,v){document.querySelectorAll('#'+gid+' .tab-btn').forEach(b=>b.classList.toggle('active',(b.dataset.v||b.dataset.p)===v))}
document.querySelectorAll('#srcTabs .source-tab').forEach(b=>b.onclick=()=>{S.m=b.dataset.m;S.camp=null;document.querySelectorAll('#srcTabs .source-tab').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('#dateGroup .tab-btn').forEach(b=>b.onclick=()=>{setPreset(b.dataset.p);setActive('dateGroup',b.dataset.p);render()});
document.getElementById('dApply').onclick=()=>{const f=document.getElementById('dFrom').value,t=document.getElementById('dTo').value;if(!f||!t)return;S.from=f<t?f:t;S.to=f<t?t:f;setActive('dateGroup','');render()};
document.querySelectorAll('#levelGroup .tab-btn').forEach(b=>b.onclick=()=>{S.level=b.dataset.v;S.camp=null;setActive('levelGroup',S.level);render()});
document.querySelectorAll('#viewGroup .tab-btn').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;setActive('viewGroup',S.view);render()});
document.getElementById('q').oninput=e=>{S.q=e.target.value.trim();render()};
document.getElementById('hideZero').onchange=e=>{S.hide=e.target.checked;render()};
document.getElementById('built').textContent='업데이트: '+DATA.built+' · 최신 '+DAYS[DAYS.length-1];
document.getElementById('dFrom').min=DAYS[0];document.getElementById('dTo').max=DAYS[DAYS.length-1];
setPreset('7');render();
</script></body></html>
